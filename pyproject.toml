[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "matylda-praxis"
version = "0.3.0rc1"
description = "Portable executable epistemic protocol"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
matylda-praxis = "matylda_praxis.cli:main"
matylda-praxis-mcp = "matylda_praxis.integrations.mcp:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
mcp = ["mcp>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["matylda_praxis*"]

[tool.setuptools.package-data]
matylda_praxis = ["web/*.html", "web/*.css", "web/*.js"]
